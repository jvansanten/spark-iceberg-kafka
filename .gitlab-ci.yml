stages:
  - test
  - build

.test-template:
  image: eclipse-temurin:17-jdk@sha256:91011320978c10ec51d2cde1eb6f616db6d2a739a0e521096c343dd3fed9abe6
  before_script:
    - apt-get update && apt-get install -y maven

run-tests:
  extends: .test-template
  stage: test
  script:
    - cd /builds/$CI_PROJECT_PATH
    - mvn test
  rules:
    - if: '$CI_COMMIT_BRANCH'

build-spark-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - |
      set -- \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --destination "$CI_REGISTRY_IMAGE:latest"
      fi
      /kaniko/executor "$@"