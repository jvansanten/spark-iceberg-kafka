name: Java Test

on:
  push:
    branches:
      - "**"
    paths:
      - '**/*.java'
      - 'pom.xml'
  pull_request:
    branches:
      - "**"
    paths:
      - '**/*.java'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Compile with Maven
        run: mvn compile

      - name: Run tests with Maven
        run: mvn test
